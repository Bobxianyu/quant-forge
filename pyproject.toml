[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-forge"
version = "0.1.0"
description = "A 股盘前环境、风险与仓位决策规则引擎"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "pyarrow==21.0.0",
]
dev = [
  "httpx==0.28.1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
quant-forge = "quant_forge.cli:main"
quant-forge-web = "quant_forge.web.app:main"

[tool.setuptools.package-data]
"quant_forge.web" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-q --cov=quant_forge --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# 项目约定新工具模块采用小驼峰命名。
"src/quant_forge/market/*.py" = ["N999"]
